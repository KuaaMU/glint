name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast, dependency-light checks. No GTK/WebKit needed.
  frontend:
    name: Frontend (typecheck, unit, contract)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm exec tsc --noEmit

      - name: Frontend unit tests
        run: pnpm test

      # The contract suite shells out to `cargo test`, so it needs a toolchain.
      - uses: dtolnay/rust-toolchain@stable

      - name: Contract suite
        run: node tests/e2e_runner.mjs

      - name: Production build
        run: pnpm build

  # glint-core has no GUI dependencies, so it can be tested everywhere.
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p glint-core

  # The Tauri shell is where platform-specific code actually breaks. Linux is
  # the mainline; Windows/macOS are checked but not yet shipped.
  tauri:
    name: Tauri shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            deps: true
          - os: windows-latest
            deps: false
          - os: macos-latest
            deps: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKitGTK dependencies
        if: matrix.deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build shell
        run: cargo build -p glint

      - name: Shell unit tests
        run: cargo test -p glint --lib

      - name: Clippy
        run: cargo clippy -p glint --all-targets -- -D warnings
