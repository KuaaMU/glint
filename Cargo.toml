[workspace]
resolver = "2"
members = [
    "crates/glint-core",
    "crates/glint-cli",
    "crates/glint-recall",
    "src-tauri",
]
# Keep the default check fast: the Tauri shell needs GTK/WebKit development
# headers, while the core crate must stay buildable on a bare Rust toolchain.
default-members = ["crates/glint-core"]

# Read the optimization guideline for more details:
# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
