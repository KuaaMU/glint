<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glint</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- 伴生卡片容器 -->
    <div id="glint-card" class="glint-card">
      <!-- 视窗拖拽与微型操作把手 -->
      <div class="card-anchor-handle" data-tauri-drag-region>
        <div class="handle-left">
          <span class="anchor-dot" title="Glint 伴生核心"></span>
          <span class="card-title-hint">Glint</span>
        </div>
        <div class="handle-right">
          <button id="btn-snip-toggle" class="icon-btn" title="截屏透视 (Alt + W)">✂</button>
          <button id="btn-settings-toggle" class="icon-btn" title="偏好设置 (独立后台窗口)">⚙</button>
          <button id="btn-close-card" class="icon-btn" title="收起 (Esc)">✕</button>
        </div>
      </div>

      <!-- 核心解释文本展示区 (流式输出) -->
      <div id="content-area" class="content-area">
        <div id="status-indicator" class="status-indicator" style="display: none;">
          <span class="spinner"></span>
          <span>正在透视本质...</span>
        </div>
        <div id="explanation-text" class="explanation-text">
          选中文本后按 <kbd>Alt + Q</kbd> 划词透视，或按 <kbd>Alt + W</kbd> 截屏透视。
        </div>
      </div>

      <!-- 底部追问输入框 -->
      <div class="card-footer">
        <div class="followup-box">
          <input
            id="followup-input"
            type="text"
            class="followup-input"
            placeholder="继续追问细节或底层原理..."
          />
          <button id="btn-send-followup" class="btn-circle-arrow" title="发送追问">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>
      </div>

      <!-- 右下角自由微缩放把手 (消除阴影死区，贴合边沿) -->
      <div id="resize-grip" class="resize-grip" title="按住拖拽调整卡片尺寸">
        <svg width="10" height="10" viewBox="0 0 10 10">
          <path d="M8 2L2 8M9 5L5 9M9 8L8 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </body>
</html>
