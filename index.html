<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glint</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- 伴生卡片容器 (琉璃质感 · 菲涅尔线稿) -->
    <div id="glint-card" class="glint-card">
      <!-- 顶部琉璃流光刃 -->
      <div class="card-streamer-glow"></div>

      <!-- 视窗拖拽与微型操作把手 -->
      <div class="card-anchor-handle" data-tauri-drag-region>
        <div class="handle-left">
          <span class="anchor-dot" title="Glint 伴生核心"></span>
          <span class="card-title-hint">Glint</span>
          <!-- 宿主环境感知胶囊 -->
          <div id="host-badge" class="host-badge" style="display: none;">
            <span class="host-dot"></span>
            <span id="host-title">桌面伴生</span>
          </div>
        </div>
        <div class="handle-right">
          <button id="btn-history-toggle" class="glass-icon-btn" title="会话历史 (Ctrl+H)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </button>
          <button id="btn-snip-toggle" class="glass-icon-btn" title="截屏透视 (Alt + W)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>
              <line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/>
            </svg>
          </button>
          <button id="btn-settings-toggle" class="glass-icon-btn" title="偏好设置">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
          <button id="btn-pin-card" class="glass-icon-btn pin-btn" title="固定卡片 (不自动收起)" aria-pressed="false">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>
            </svg>
          </button>
          <button id="btn-close-card" class="glass-icon-btn close-btn" title="收起 (Esc)">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- 回声：同一概念在别的线索里问过（未命中时整行不渲染） -->
      <div id="echo-line" class="echo-line" style="display: none;"></div>

      <!-- 核心解释文本展示区 (流式输出) -->
      <div id="content-area" class="content-area">
        <!-- 选中文本超限截断防护胶囊 -->
        <div id="truncation-capsule" class="truncation-capsule" style="display: none;">
          <span class="capsule-icon">✂️</span>
          <span id="truncation-capsule-text">已截取前 3,000 字符 · 保护上下文</span>
        </div>
        <div id="status-indicator" class="status-indicator" style="display: none;">
          <span class="spinner-dot"></span>
          <span>正在透视本质...</span>
        </div>
        <div id="explanation-text" class="explanation-text">
          选中文本后按 <kbd>Alt + Q</kbd> 划词透视，或按 <kbd>Alt + W</kbd> 截屏透视。
        </div>
      </div>

      <!-- 底部追问输入框 -->
      <div class="card-footer">
        <div class="followup-box">
          <input
            id="followup-input"
            type="text"
            class="followup-input"
            placeholder="深入追问当前语境细节或底层原理..."
            spellcheck="false"
          />
          <button id="btn-send-followup" class="btn-circle-arrow" title="发送追问 (Enter)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>
      </div>

      <!-- 会话历史漫游透镜板 (磨砂琉璃 · 卡片内置透视 Deck) -->
      <div id="history-deck" class="history-deck" style="display: none;">
        <div class="history-deck-header">
          <div class="history-title-row">
            <div class="history-title-badge">
              <span class="history-icon">📜</span>
              <span class="history-title">历史漫游透镜</span>
            </div>
            <button id="btn-close-history" class="glass-icon-btn close-btn" title="收起 (Esc)">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
          <div class="history-search-row">
            <input id="history-search-input" type="text" class="history-search-input" placeholder="输入关键词或宿主过滤..." spellcheck="false" />
          </div>
        </div>
        <div id="history-list" class="history-list">
          <!-- 历史列表项 -->
        </div>
        <div class="history-deck-footer">
          <button id="btn-export-markdown" class="history-action-btn" title="导出为 Markdown 伴生笔记">
            📋 复制全部笔记
          </button>
          <button id="btn-clear-history" class="history-action-btn text-danger" title="清空全部会话记录">
            🗑️ 清空历史
          </button>
        </div>
      </div>

      <!-- 右下角自由微缩放把手 (消除阴影死区，贴合边沿) -->
      <div id="resize-grip" class="resize-grip" title="按住拖拽调整卡片尺寸">
        <svg width="9" height="9" viewBox="0 0 10 10">
          <path d="M8 2L2 8M9 5L5 9M9 8L8 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </body>
</html>
