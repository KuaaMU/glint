<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glint 偏好设置</title>
    <link rel="stylesheet" href="/src/preferences.css" />
  </head>
  <body>
    <!-- 琉璃窗体顶层流光线 -->
    <div class="streamer-glow-line"></div>

    <div class="pref-shell">
      <!-- 顶部玻璃导航条 -->
      <header class="pref-header">
        <div class="brand-cluster">
          <div class="lens-spark">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M3 12h3m12 0h3M12 3v3m0 12v3"></path>
              <path d="m5.6 5.6 2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1M7.7 16.3l-2.1 2.1"></path>
            </svg>
          </div>
          <span class="brand-name">Glint</span>
          <span class="brand-tag">偏好设置</span>
        </div>

        <button id="btn-close-pref" class="glass-icon-btn" type="button" title="关闭 (Esc)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </header>

      <!-- 琉璃选项卡切换 -->
      <nav class="glass-tabs">
        <button class="tab-pill active" data-tab="tab-model" type="button">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          <span>模型服务</span>
        </button>
        <button class="tab-pill" data-tab="tab-hotkeys" type="button">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="3"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h8"/></svg>
          <span>全局热键</span>
        </button>
        <button class="tab-pill" data-tab="tab-interface" type="button">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1Z"/></svg>
          <span>外观形态</span>
        </button>
      </nav>

      <!-- 内容区 -->
      <main class="tab-content-area">
        <!-- Tab 1: 模型与连接 -->
        <section id="tab-model" class="tab-pane active">
          <!-- 预设选择器 -->
          <div class="glass-card">
            <div class="card-caption">服务提供商</div>
            <div class="provider-pill-grid">
              <button class="provider-btn active" data-preset="deepseek" type="button">DeepSeek</button>
              <button class="provider-btn" data-preset="openai" type="button">OpenAI</button>
              <button class="provider-btn" data-preset="kimi" type="button">Kimi</button>
              <button class="provider-btn" data-preset="ollama" type="button">Ollama 本地</button>
              <button class="provider-btn" data-preset="custom" type="button">自定义端点</button>
            </div>
          </div>

          <!-- 端点配置 -->
          <div class="glass-card">
            <div class="field-block">
              <label class="field-label" for="pref-base-url">API Base URL</label>
              <input id="pref-base-url" class="glass-input mono" placeholder="https://api.deepseek.com/v1" spellcheck="false" />
            </div>

            <div class="field-block">
              <label class="field-label" for="pref-api-key">API Key</label>
              <div class="input-with-action">
                <input id="pref-api-key" type="password" class="glass-input mono" placeholder="sk-..." spellcheck="false" />
                <button id="btn-toggle-key-reveal" class="subtle-action-btn" type="button">显示</button>
              </div>
            </div>

            <div class="field-block">
              <div class="field-header-row">
                <label class="field-label" for="pref-model">模型标识 (Model Name)</label>
                <button id="btn-fetch-models" class="hairline-probe-btn" type="button">
                  <span id="fetch-spinner" class="probe-spinner" style="display:none;"></span>
                  <span id="fetch-btn-label">探测可用模型</span>
                </button>
              </div>
              <div class="model-input-cluster">
                <input id="pref-model" class="glass-input mono" placeholder="deepseek-chat" list="model-datalist" spellcheck="false" />
                <select id="pref-model-select" class="glass-select mono" style="display:none;">
                  <option value="">快速点选已探测模型...</option>
                </select>
              </div>
              <datalist id="model-datalist"></datalist>
              <div id="fetch-status-text" class="status-tip"></div>
            </div>

            <div class="test-connectivity-strip">
              <button id="btn-test-connection" class="hairline-test-btn" type="button">
                <span>⚡ 测通性与延迟</span>
              </button>
              <div id="test-result-indicator" class="connectivity-badge">就绪</div>
            </div>
          </div>
        </section>

        <!-- Tab 2: 全局热键 -->
        <section id="tab-hotkeys" class="tab-pane">
          <div class="glass-card">
            <div class="card-caption">快捷指令</div>

            <div class="hotkey-item">
              <div class="hotkey-meta">
                <span class="hotkey-title">划词透视</span>
                <span class="hotkey-desc">在任意软件中选中文本后直达本质</span>
              </div>
              <kbd class="glass-kbd">Alt + Q</kbd>
            </div>

            <div class="hotkey-divider"></div>

            <div class="hotkey-item">
              <div class="hotkey-meta">
                <span class="hotkey-title">截屏透视</span>
                <span class="hotkey-desc">全屏预热遮罩 · 1px 微光框选与手绘标注</span>
              </div>
              <kbd class="glass-kbd">Alt + W</kbd>
            </div>

            <div class="hotkey-divider"></div>

            <div class="hotkey-item">
              <div class="hotkey-meta">
                <span class="hotkey-title">显隐卡片</span>
                <span class="hotkey-desc">在鼠标光标旁秒级呼出或折叠伴生视窗</span>
              </div>
              <kbd class="glass-kbd">Alt + D</kbd>
            </div>

            <div class="hotkey-divider"></div>

            <div class="hotkey-item">
              <div class="hotkey-meta">
                <span class="hotkey-title">极速关闭</span>
                <span class="hotkey-desc">隐藏当前透视卡片或取消截屏</span>
              </div>
              <kbd class="glass-kbd">Esc</kbd>
            </div>
          </div>
        </section>

        <!-- Tab 3: 外观形态 -->
        <section id="tab-interface" class="tab-pane">
          <div class="glass-card">
            <div class="card-caption">伴生视窗行为</div>

            <div class="toggle-item">
              <div class="toggle-meta">
                <span class="toggle-title">置顶显示 (Always on Top)</span>
                <span class="toggle-desc">伴生卡片悬浮于其他窗口之上，避免被遮挡</span>
              </div>
              <label class="switch-toggle">
                <input id="pref-always-on-top" type="checkbox" checked />
                <span class="switch-slider"></span>
              </label>
            </div>

            <div class="hotkey-divider"></div>

            <div class="toggle-item">
              <div class="toggle-meta">
                <span class="toggle-title">重置卡片几何尺寸</span>
                <span class="toggle-desc">还原 HUD 伴生视窗为初始 440 × 380 黄金比例</span>
              </div>
              <button id="btn-reset-window-size" class="subtle-action-btn" type="button">重置尺寸</button>
            </div>
          </div>

          <div class="glass-card">
            <div class="card-caption">关于 Glint</div>
            <div class="brand-preview-row">
              <img src="/app_icon_master.png" alt="Glint Icon" class="brand-logo-img" />
              <div class="brand-info">
                <div class="brand-title">Glint 桌面伴生透镜</div>
                <div class="brand-sub">环境感知 · 划词透视 · 多模态图文解析</div>
              </div>
              <span class="version-badge">v0.1.0</span>
            </div>
          </div>
        </section>
      </main>

      <!-- 底部操作悬浮栏 -->
      <footer class="pref-footer">
        <button id="btn-save-pref-all" class="streamer-save-btn" type="button">
          <span>保存配置</span>
        </button>
      </footer>
    </div>

    <!-- 浮动琉璃 Toast -->
    <div id="save-toast" class="glass-toast">配置已生效并同步</div>

    <script type="module" src="/src/preferences.ts"></script>
  </body>
</html>
